[project]
name = "ledgerline"
version = "0.1.0"
description = "Autonomous revenue-operations agent for PayPal merchants: event-sourced ledger, reconciliation, policy-gated AI remediation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3.20",
    "langchain-anthropic>=0.3.5",
    "langchain-openai>=0.3.0",
    "tenacity>=8.5",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "respx>=0.21", "freezegun"]

[project.scripts]
ledgerline = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
