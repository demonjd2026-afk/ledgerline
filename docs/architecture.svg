<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#4a5568"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f855a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#c05621"/></marker>
    <style>
      .bg{fill:#f5f6f8}
      .band{fill:#ffffff;stroke:#d5dae3;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#cfd5df;stroke-width:1.2}
      .boxb{fill:#eef4ff;stroke:#9fb8ea;stroke-width:1.4}
      .boxo{fill:#fff7ec;stroke:#e6b680;stroke-width:1.4}
      .boxg{fill:#eefaf2;stroke:#93c9a8;stroke-width:1.4}
      .ic{fill:none;stroke:#1d4ed8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .ico{fill:none;stroke:#c05621;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .icg{fill:none;stroke:#2f855a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .icn{fill:none;stroke:#111827;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
      .num{fill:#1d4ed8;font-size:11px;font-weight:700;letter-spacing:.08em}
      .h{font-weight:700;font-size:15px;fill:#111827}
      .hb{font-weight:700;font-size:14.5px;fill:#111827}
      .t{fill:#374151;font-size:12.5px}
      .s{fill:#6b7280;font-size:11.5px}
      .e{stroke:#4a5568;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .eg{stroke:#2f855a;stroke-width:1.7;fill:none;marker-end:url(#ag)}
      .eo{stroke:#c05621;stroke-width:1.7;fill:none;marker-end:url(#ao)}
      .lbl{fill:#4a5568;font-size:11.5px}
      .lg{fill:#2f855a;font-size:11.5px;font-weight:600}
      .lo{fill:#c05621;font-size:11.5px;font-weight:600}
    </style>
  </defs>
  <rect class="bg" width="1240" height="640"/>

  <!-- PayPal -->
  <rect x="30" y="24" width="1180" height="66" rx="10" class="band"/>
  <g transform="translate(48 41)">
    <rect x="2" y="5" width="20" height="14" rx="2" class="icn"/><path d="M2 10h20" class="icn"/>
  </g>
  <text x="82" y="50" class="h">PayPal</text>
  <text x="82" y="72" class="s">Webhooks · Orders v2 · Payments v2 · Transaction Search · Disputes v1 · Payouts v1 · Invoicing v2 · MCP server (@paypal/mcp, with sandbox keys)</text>

  <!-- arrows down from PayPal -->
  <path class="e" d="M115 90 V148"/>
  <text x="124" y="124" class="lbl">signed webhooks</text>
  <path class="e" d="M300 90 V148"/>
  <text x="309" y="124" class="lbl">polling · direct reads</text>
  <path class="e" d="M625 90 V148"/>
  <text x="634" y="124" class="lbl">read-only MCP tools</text>

  <!-- 7 steps -->
  <!-- 1 Ingest -->
  <rect x="40" y="150" width="150" height="150" rx="10" class="box"/>
  <g transform="translate(56 166)"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" class="ic"/></g>
  <text x="96" y="178" class="num">STEP 1</text>
  <text x="56" y="214" class="hb">Ingest</text>
  <text x="56" y="236" class="t">verify signature</text>
  <text x="56" y="254" class="t">enqueue in ms</text>
  <text x="56" y="278" class="s">dedupe · retries</text>

  <path class="e" d="M190 225 H208"/>

  <!-- 2 Ledger -->
  <rect x="210" y="150" width="150" height="150" rx="10" class="box"/>
  <g transform="translate(226 166)"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" class="ic"/></g>
  <text x="266" y="178" class="num">STEP 2</text>
  <text x="226" y="214" class="hb">Ledger</text>
  <text x="226" y="236" class="t">append-only events</text>
  <text x="226" y="254" class="t">rebuildable views</text>
  <text x="226" y="278" class="s">idempotent · exact money</text>

  <path class="e" d="M360 225 H378"/>

  <!-- 3 Reconcile -->
  <rect x="380" y="150" width="150" height="150" rx="10" class="box"/>
  <g transform="translate(396 166)"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" class="ic"/></g>
  <text x="436" y="178" class="num">STEP 3</text>
  <text x="396" y="214" class="hb">Reconcile</text>
  <text x="396" y="236" class="t">13 rules → breaks</text>
  <text x="396" y="254" class="t">expected vs observed</text>
  <text x="396" y="278" class="s">self-resolving</text>

  <path class="e" d="M530 225 H548"/>

  <!-- 4 Agent -->
  <rect x="550" y="150" width="150" height="150" rx="10" class="box"/>
  <g transform="translate(566 166)"><rect x="4" y="4" width="16" height="16" rx="2" class="ic"/><rect x="9" y="9" width="6" height="6" class="ic"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" class="ic"/></g>
  <text x="606" y="178" class="num">STEP 4</text>
  <text x="566" y="214" class="hb">Agent</text>
  <text x="566" y="236" class="t">LangGraph: triage →</text>
  <text x="566" y="254" class="t">specialist → proposal</text>
  <text x="566" y="278" class="s">read-only tools only</text>

  <path class="e" d="M700 225 H718"/>

  <!-- 5 Policy gate -->
  <rect x="720" y="150" width="150" height="150" rx="10" class="boxb"/>
  <g transform="translate(736 166)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" class="ic"/><path d="M9 12l2 2 4-4" class="ic"/></g>
  <text x="776" y="178" class="num">STEP 5</text>
  <text x="736" y="214" class="hb">Policy gate</text>
  <text x="736" y="236" class="t">versioned YAML</text>
  <text x="736" y="254" class="t">limits · blocklists</text>
  <text x="736" y="278" class="s">deterministic</text>

  <path class="eo" d="M870 225 H888"/>

  <!-- 6 Operator -->
  <rect x="890" y="150" width="150" height="150" rx="10" class="boxo"/>
  <g transform="translate(906 166)"><circle cx="12" cy="7" r="4" class="ico"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" class="ico"/></g>
  <text x="946" y="178" class="num" fill="#c05621">STEP 6</text>
  <text x="906" y="214" class="hb">Person</text>
  <text x="906" y="236" class="t">proposal · evidence</text>
  <text x="906" y="254" class="t">policy reasons</text>
  <text x="906" y="278" class="s">approve · decline</text>

  <path class="eg" d="M1040 225 H1058"/>

  <!-- 7 Executor -->
  <rect x="1060" y="150" width="150" height="150" rx="10" class="boxg"/>
  <g transform="translate(1076 166)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" class="icg"/></g>
  <text x="1116" y="178" class="num" fill="#2f855a">STEP 7</text>
  <text x="1116" y="214" class="hb">Execute</text>
  <text x="1076" y="236" class="t">the only PayPal writer</text>
  <text x="1076" y="254" class="t">one key per approval</text>
  <text x="1076" y="278" class="s">dry-run for demos</text>

  <!-- bypass: within policy -->
  <path class="eg" d="M795 150 V128 H1135 V148"/>
  <text x="965" y="123" class="lg" text-anchor="middle">within policy → runs on its own</text>
  <text x="965" y="313" class="lo" text-anchor="middle">otherwise the graph interrupts and waits for a person</text>

  <!-- executor writes back to PayPal -->
  <path class="e" d="M1210 225 H1226 V57 H1212"/>
  <text x="1220" y="140" class="lbl" transform="rotate(-90 1220 140)" text-anchor="middle">refund · evidence · message</text>

  <!-- corrections back to ledger -->
  <path class="e" d="M1135 300 V336 H285 V302"/>
  <text x="710" y="330" class="lbl" text-anchor="middle">every action comes back as a correction event · the ledger is never edited</text>

  <!-- Postgres -->
  <rect x="30" y="366" width="1180" height="64" rx="10" class="band"/>
  <g transform="translate(48 384)"><ellipse cx="12" cy="5" rx="9" ry="3" class="icn"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3" class="icn"/></g>
  <text x="82" y="391" class="h">One Postgres, one truth</text>
  <text x="82" y="413" class="s">ledger_events · projections · breaks · agent_runs · approvals · jobs (SKIP LOCKED) · webhook_inbox · LangGraph checkpoints — every step above reads and writes here</text>

  <!-- Guardrails -->
  <rect x="30" y="446" width="1180" height="64" rx="10" class="band"/>
  <g transform="translate(48 464)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" class="icn"/><path d="M12 8v4M12 16h.01" class="icn"/></g>
  <text x="82" y="471" class="h">Guardrails</text>
  <text x="82" y="493" class="s">The model never holds a write tool · proposals are typed and checked against the ledger · a refund can never exceed its capture · buyer text is fenced as data · disputes always wait for a person</text>

  <!-- Deploy -->
  <rect x="30" y="526" width="1180" height="64" rx="10" class="band"/>
  <g transform="translate(48 544)"><path d="M17.5 19a4.5 4.5 0 1 0-1-8.9A6 6 0 0 0 5 12a4 4 0 0 0 .5 7z" class="icn"/></g>
  <text x="82" y="551" class="h">Runs on Render</text>
  <text x="82" y="573" class="s">web (FastAPI + React console) · worker (queue, poller, agents) · managed Postgres · one Docker image · migrations pre-deploy · CI: pytest, ruff, bandit, pip-audit, npm audit, CodeQL</text>

  <text x="1210" y="620" class="s" text-anchor="end">Ledgerline · github.com/demonjd2026-afk/ledgerline</text>
</svg>
