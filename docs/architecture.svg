<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#4b5563"/></marker>
    <style>
      .box{fill:#fbfcf9;stroke:#cfd7cc;stroke-width:1.2;rx:6}
      .ink{fill:#16202f;stroke:#16202f}
      .t{fill:#16202f}.m{fill:#4b5563}.s{fill:#8a93a1;font-size:11.5px}
      .h{font-weight:700;font-size:14px}
      .edge{stroke:#4b5563;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .lbl{fill:#4b5563;font-size:11px}
      .red{fill:#b0313f}.green{fill:#286644}.blue{fill:#2c5a98}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#eef1ec"/>

  <!-- PayPal -->
  <rect x="30" y="30" width="1040" height="78" class="box"/>
  <text x="50" y="56" class="h t">PayPal (sandbox)</text>
  <text x="50" y="80" class="m">Webhooks · Orders v2 · Payments v2 · Transaction Search · Disputes v1 · Payouts v1 · Invoicing v2 · PayPal MCP server (@paypal/mcp)</text>
  <text x="50" y="98" class="s">push: signed webhooks  ·  pull: polling + direct reads  ·  tools: read-only MCP for the agent  ·  write: executor only</text>

  <!-- Ingest -->
  <rect x="30" y="150" width="235" height="96" class="box"/>
  <text x="50" y="176" class="h t">Ingest</text>
  <text x="50" y="198" class="m">verify-webhook-signature</text>
  <text x="50" y="216" class="m">inbox → Postgres job queue</text>
  <text x="50" y="234" class="s">SKIP LOCKED · dedupe · retries</text>

  <!-- Ledger -->
  <rect x="300" y="150" width="235" height="96" class="box"/>
  <text x="320" y="176" class="h t">Ledger</text>
  <text x="320" y="198" class="m">append-only events, idempotent</text>
  <text x="320" y="216" class="m">deterministic projections</text>
  <text x="320" y="234" class="s">rebuildable · integer money</text>

  <!-- Reconcile -->
  <rect x="570" y="150" width="235" height="96" class="box"/>
  <text x="590" y="176" class="h t">Reconcile</text>
  <text x="590" y="198" class="m">13 rules → typed breaks</text>
  <text x="590" y="216" class="m">expected · observed · delta</text>
  <text x="590" y="234" class="s">auto-resolve when a rule stops firing</text>

  <!-- Console -->
  <rect x="840" y="150" width="230" height="96" class="box"/>
  <text x="860" y="176" class="h t">Operator console</text>
  <text x="860" y="198" class="m">breaks · decision sheet</text>
  <text x="860" y="216" class="m">approvals · traces · ledger</text>
  <text x="860" y="234" class="s">React · AG Grid · token-guarded API</text>

  <!-- Agent runtime -->
  <rect x="30" y="300" width="775" height="150" class="box"/>
  <text x="50" y="326" class="h t">Agent runtime — LangGraph, checkpointed in Postgres</text>
  <g font-size="12.5">
    <rect x="50" y="345" width="118" height="40" rx="5" fill="#e4e9e2" stroke="#cfd7cc"/><text x="109" y="369" text-anchor="middle" class="t">load context</text>
    <rect x="190" y="345" width="100" height="40" rx="5" fill="#e4e9e2" stroke="#cfd7cc"/><text x="240" y="369" text-anchor="middle" class="t">triage</text>
    <rect x="312" y="345" width="150" height="40" rx="5" fill="#e4e9e2" stroke="#cfd7cc"/><text x="387" y="363" text-anchor="middle" class="t">specialist</text><text x="387" y="378" text-anchor="middle" class="s">read-only tools, bounded</text>
    <rect x="484" y="345" width="110" height="40" rx="5" fill="#dfe8f4" stroke="#2c5a98"/><text x="539" y="363" text-anchor="middle" class="blue" font-weight="700">policy gate</text><text x="539" y="378" text-anchor="middle" class="s">YAML, deterministic</text>
    <rect x="616" y="330" width="170" height="32" rx="5" fill="#dcecdf" stroke="#286644"/><text x="701" y="351" text-anchor="middle" class="green" font-weight="700">auto → execute</text>
    <rect x="616" y="372" width="170" height="32" rx="5" fill="#f7ead2" stroke="#b9791f"/><text x="701" y="393" text-anchor="middle" fill="#b9791f" font-weight="700">interrupt → human</text>
    <path d="M168 365H190M290 365H312M462 365H484M594 358L616 346M594 372L616 388" class="edge"/>
  </g>
  <text x="50" y="420" class="s">Structured outputs (headline, rationale, action, exact ids/amounts) · amounts bounded by the ledger · untrusted buyer text fenced · confidence floor · token accounting · eval harness</text>
  <text x="50" y="438" class="s">The LLM never holds a write tool. One executor, idempotency keys derived from the approval id, dry-run mode for demos.</text>

  <!-- Postgres -->
  <rect x="840" y="300" width="230" height="150" class="box"/>
  <text x="860" y="326" class="h t">Postgres</text>
  <text x="860" y="348" class="m">ledger_events · projections</text>
  <text x="860" y="366" class="m">breaks · agent_runs · approvals</text>
  <text x="860" y="384" class="m">jobs · webhook_inbox</text>
  <text x="860" y="402" class="m">langgraph checkpoints</text>
  <text x="860" y="430" class="s">single source of truth · migrations</text>

  <!-- edges -->
  <path d="M147 108V150" class="edge"/><text x="155" y="134" class="lbl">webhooks</text>
  <path d="M417 108V150" class="edge"/><text x="425" y="134" class="lbl">polls, direct reads</text>
  <path d="M265 198H300" class="edge"/>
  <path d="M535 198H570" class="edge"/>
  <path d="M687 246V300" class="edge"/><text x="695" y="278" class="lbl">new breaks → jobs</text>
  <path d="M805 198H840" class="edge"/>
  <path d="M955 246V300" class="edge"/>
  <path d="M955 108V150" class="edge"/><text x="963" y="134" class="lbl">approve → execute</text>
  <path d="M750 300V246" class="edge"/><text x="758" y="278" class="lbl">corrections are events</text>

  <!-- Deploy strip -->
  <rect x="30" y="480" width="1040" height="52" class="box"/>
  <text x="50" y="503" class="h t">Deploy</text>
  <text x="120" y="503" class="m">Render Blueprint: web (API + console) · worker (queue, poller, agents) · managed Postgres  —  Docker image, migrations pre-deploy, OPERATOR_TOKEN, prod rejects unverified webhooks</text>
  <text x="120" y="521" class="s">CI: pytest (28, real Postgres) · ruff · bandit · pip-audit · npm audit · CodeQL</text>
</svg>
