<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3f4a5a"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#2f7a4f"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#b2641a"/></marker>
    <style>
      .bg{fill:#f3f4f1}
      .band{fill:#e9ecf3;stroke:#c9d0dd;stroke-width:1.2}
      .box{fill:#ffffff;stroke:#c7cdd6;stroke-width:1.2}
      .boxg{fill:#f1f7f3;stroke:#9ec4ad;stroke-width:1.2}
      .boxo{fill:#fdf5ea;stroke:#e2b47c;stroke-width:1.2}
      .boxb{fill:#eef3fc;stroke:#9db5e3;stroke-width:1.2}
      .db{fill:#f6f3ea;stroke:#d4c7a2;stroke-width:1.2}
      .h{font-weight:700;font-size:14.5px;fill:#16202f}
      .t{fill:#2b3442}
      .s{fill:#7b8594;font-size:11.5px}
      .k{fill:#7b8594;font-size:11px;letter-spacing:.06em;font-weight:600}
      .e{stroke:#3f4a5a;stroke-width:1.4;fill:none;marker-end:url(#arr)}
      .eg{stroke:#2f7a4f;stroke-width:1.6;fill:none;marker-end:url(#arrg)}
      .eo{stroke:#b2641a;stroke-width:1.6;fill:none;marker-end:url(#arro)}
      .ed{stroke:#8a93a1;stroke-width:1.2;fill:none;stroke-dasharray:4 4;marker-end:url(#arr)}
      .lbl{fill:#3f4a5a;font-size:11.5px}
      .lblg{fill:#2f7a4f;font-size:11.5px;font-weight:600}
      .lblo{fill:#b2641a;font-size:11.5px;font-weight:600}
      .step{fill:#eaf0ec;stroke:#b8c9bd;stroke-width:1}
      .stept{fill:#2b3442;font-size:12px}
    </style>
  </defs>
  <rect class="bg" width="1240" height="760"/>

  <!-- PayPal band -->
  <rect x="30" y="28" width="1140" height="78" rx="8" class="band"/>
  <text x="50" y="54" class="h">PayPal (sandbox)</text>
  <text x="50" y="76" class="t">Webhooks · Orders v2 · Payments v2 · Transaction Search · Disputes v1 · Payouts v1 · Invoicing v2 · PayPal MCP server (@paypal/mcp)</text>
  <text x="50" y="95" class="s">push: signed webhooks   ·   pull: polling + direct reads   ·   tools: read-only MCP for the agent   ·   writes: executor only</text>

  <!-- arrows from PayPal -->
  <path class="e" d="M130 106 V176"/>
  <text x="140" y="146" class="lbl">signed webhooks</text>
  <path class="e" d="M372 106 V176"/>
  <text x="382" y="146" class="lbl">polling, direct reads</text>

  <!-- Row 1: pipeline -->
  <rect x="30" y="178" width="200" height="112" rx="8" class="box"/>
  <text x="46" y="203" class="h">1 · Ingest</text>
  <text x="46" y="226" class="t">verify-webhook-signature</text>
  <text x="46" y="244" class="t">inbox → job queue (2xx in ms)</text>
  <text x="46" y="266" class="s">SKIP LOCKED · dedupe · retries</text>

  <path class="e" d="M230 234 H258"/>
  <rect x="260" y="178" width="220" height="112" rx="8" class="box"/>
  <text x="276" y="203" class="h">2 · Ledger</text>
  <text x="276" y="226" class="t">append-only, idempotent events</text>
  <text x="276" y="244" class="t">deterministic projections</text>
  <text x="276" y="266" class="s">rebuildable · integer money</text>

  <path class="e" d="M480 234 H508"/>
  <rect x="510" y="178" width="200" height="112" rx="8" class="box"/>
  <text x="526" y="203" class="h">3 · Reconcile</text>
  <text x="526" y="226" class="t">13 rules → typed breaks</text>
  <text x="526" y="244" class="t">expected · observed · delta</text>
  <text x="526" y="266" class="s">auto-resolves when a rule stops firing</text>

  <path class="e" d="M710 234 H738"/>
  <rect x="740" y="178" width="240" height="112" rx="8" class="box"/>
  <text x="756" y="203" class="h">4 · Agent (LangGraph)</text>
  <rect x="756" y="214" width="62" height="24" rx="5" class="step"/><text x="787" y="230" text-anchor="middle" class="stept">context</text>
  <path class="e" d="M818 226 H828"/>
  <rect x="830" y="214" width="54" height="24" rx="5" class="step"/><text x="857" y="230" text-anchor="middle" class="stept">triage</text>
  <path class="e" d="M884 226 H894"/>
  <rect x="896" y="214" width="68" height="24" rx="5" class="step"/><text x="930" y="230" text-anchor="middle" class="stept">specialist</text>
  <text x="756" y="256" class="s">read-only tools: ledger + PayPal MCP</text>
  <text x="756" y="272" class="s">output: structured proposal, never prose</text>

  <path class="e" d="M980 234 H1008"/>
  <rect x="1010" y="178" width="160" height="112" rx="8" class="boxb"/>
  <text x="1026" y="203" class="h">5 · Policy gate</text>
  <text x="1026" y="226" class="t">versioned YAML</text>
  <text x="1026" y="244" class="t">thresholds · blocklists</text>
  <text x="1026" y="262" class="t">confidence floor</text>
  <text x="1026" y="280" class="s">deterministic</text>

  <!-- Policy gate outputs -->
  <path class="eg" d="M1120 290 V368"/>
  <text x="1114" y="320" class="lblg" text-anchor="end">within policy</text>
  <path class="eo" d="M1040 290 V330 H905 V368"/>
  <text x="918" y="348" class="lblo">needs a person — the graph interrupts</text>

  <!-- Row 2 -->
  <rect x="740" y="370" width="220" height="112" rx="8" class="boxo"/>
  <text x="756" y="395" class="h">6 · Operator console</text>
  <text x="756" y="418" class="t">proposal · evidence · reasons</text>
  <text x="756" y="436" class="t">approve / decline · tool trace</text>
  <text x="756" y="458" class="s">React + AG Grid · token-guarded API</text>

  <path class="eg" d="M960 426 H1008"/>
  <text x="984" y="415" class="lblg" text-anchor="middle" font-size="10.5">approve</text>
  <rect x="1010" y="370" width="160" height="112" rx="8" class="boxg"/>
  <text x="1026" y="395" class="h">7 · Executor</text>
  <text x="1026" y="418" class="t">the only code that</text>
  <text x="1026" y="436" class="t">writes to PayPal</text>
  <text x="1026" y="458" class="s">idempotency key = approval id</text>
  <text x="1026" y="474" class="s">dry-run mode for demos</text>

  <!-- Executor → PayPal (write) -->
  <path class="e" d="M1170 426 H1200 V96 H1172"/>
  <text x="1216" y="262" class="lbl" transform="rotate(-90 1216 262)" text-anchor="middle">writes: refund · evidence · message · invoice</text>

  <!-- Executor → Ledger (correction events) -->
  <path class="e" d="M1090 482 V520 H370 V292"/>
  <text x="700" y="512" class="lbl" text-anchor="middle">correction events (append-only; the ledger is never edited)</text>


  <!-- Postgres band -->
  <rect x="30" y="548" width="1140" height="84" rx="8" class="db"/>
  <text x="50" y="574" class="h">Postgres — single source of truth</text>
  <text x="50" y="597" class="t">ledger_events (append-only) · projections: orders, captures, refunds, payouts, disputes, invoices · breaks · agent_runs · approvals</text>
  <text x="50" y="617" class="t">jobs (FOR UPDATE SKIP LOCKED) · webhook_inbox · LangGraph checkpoints — every box above reads and writes here; the worker drains jobs</text>

  <!-- Deploy band -->
  <rect x="30" y="656" width="1140" height="76" rx="8" class="band"/>
  <text x="50" y="681" class="h">Deploy &amp; CI</text>
  <text x="50" y="703" class="t">Render Blueprint: web (FastAPI + console) · worker (queue, poller, agents) · managed Postgres · one Docker image · migrations pre-deploy</text>
  <text x="50" y="722" class="s">GitHub Actions: pytest (28 tests, real Postgres) · ruff · bandit · pip-audit · npm audit · CodeQL</text>

  <!-- Guardrail note -->
  <rect x="30" y="370" width="690" height="112" rx="8" class="box"/>
  <text x="46" y="395" class="h">Guardrails</text>
  <text x="46" y="418" class="t">The model never holds a write tool. Proposals are typed; ids and amounts are checked against the ledger.</text>
  <text x="46" y="436" class="t">A refund can never exceed its capture. Buyer-written text is fenced as data, not instructions.</text>
  <text x="46" y="454" class="t">Low confidence, or anything touching a dispute, always waits for a person.</text>
  <text x="46" y="474" class="s">One executor, one audit trail: every approval records the policy version, its reasons and the exact PayPal request.</text>
</svg>
